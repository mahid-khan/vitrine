name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA (e.g. a Litterbox or release asset link)"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, release, gofile, litterbox, filebin, all]

env:
  THEOS: ${{ github.workspace }}/theos

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p ipa
          curl -fsSL -A "Mozilla/5.0" "$IPA_URL" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA (the link probably points to a web page, not the file)"; exit 1 ;; esac

      - run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method == 'artifacts' || inputs.upload_method == 'all'
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: GitHub release (direct link)
        if: inputs.upload_method == 'release' || inputs.upload_method == 'all'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_id }}"
          gh release create "$TAG" out/*.ipa --title "$TAG" --notes "Automated build"
          echo "### GitHub release" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            echo "- https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload to Gofile
        if: inputs.upload_method == 'gofile' || inputs.upload_method == 'all'
        run: |
          echo "### Gofile" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            URL=$(curl -fsS -F "file=@$f" https://upload.gofile.io/uploadfile | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['downloadPage'])")
            echo "- $URL" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload to Litterbox (72h, direct link)
        if: inputs.upload_method == 'litterbox' || inputs.upload_method == 'all'
        run: |
          echo "### Litterbox (expires in 72h)" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            URL=$(curl -fsS -F "reqtype=fileupload" -F "time=72h" -F "fileToUpload=@$f" https://litterbox.catbox.moe/resources/internals/api.php)
            echo "- $URL" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload to filebin.net
        if: inputs.upload_method == 'filebin' || inputs.upload_method == 'all'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, so download promptly._" >> "$GITHUB_STEP_SUMMARY"
